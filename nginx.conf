server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Fallback SPA: cualquier ruta que no sea un archivo físico
    # (ej. /dashboard, /board/123) se resuelve con index.html, dejando
    # que React Router la maneje del lado del cliente. Sin esto,
    # recargar una ruta distinta a "/" da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agresivo para assets con hash en el nombre (JS/CSS de Vite).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
